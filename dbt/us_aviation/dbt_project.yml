# dbt/us_aviation/dbt_project.yml
# ============================================================
# dbt Project Configuration — US Aviation Analytics
# ============================================================

name: 'us_aviation'
version: '1.0.0'
config-version: 2

# Profile yang digunakan (harus match dengan nama di profiles.yml)
profile: 'us_aviation'

# Lokasi folder model, macros, tests, seeds
model-paths:    ["models"]
macro-paths:    ["macros"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

# Folder output compiled SQL dan run results
target-path:  "target"
clean-targets: ["target", "dbt_packages"]

# Model Configurations per Layer
models:
  us_aviation:

    staging:
      # Staging = view (ringan, no storage cost)
      +materialized: view
      +schema: staging
      # Tag untuk selective run: dbt run --select tag:staging
      +tags: ["staging"]

    intermediate:
      # Intermediate = table (kalkulasi lebih berat, di-cache)
      +materialized: table
      +schema: intermediate
      +tags: ["intermediate"]

      int_flights_enriched:
        +partition_by:
          field: flight_date
          data_type: date
          granularity: month
        +cluster_by: ["carrier_code", "origin_airport_code"]

    marts:
      # Marts = table (dikonsumsi langsung oleh Power BI)
      +materialized: table
      +schema: marts
      +tags: ["marts"]
      # Partitioning untuk fact tables besar
      dim_date:
        +materialized: table

      dim_carrier:
        +materialized: table

      dim_airport:
        +materialized: table

      dim_route:
        +materialized: table

      dim_delay_cause:
        +materialized: table

      fact_flights:
        +materialized: table
        +partition_by:
          field: flight_date
          data_type: date
          granularity: month
        +cluster_by: ["carrier_code", "origin_airport_code"]

      fact_route_monthly:
        +materialized: table
        +partition_by:
          field: flight_month_date
          data_type: date
          granularity: month
        +cluster_by: ["carrier_code"]

    reporting:
      # Reporting = table (KPI aggregates untuk Power BI)
      +materialized: table
      +schema: reporting
      +tags: ["reporting"]

# Variable Definitions
vars:
  # Periode analisis — bisa di-override saat run
  start_date: '2019-01-01'
  end_date:   '2023-12-31'

  # Definisi "delayed" sesuai DOT standard
  delay_threshold_minutes: 15

  # Project ID untuk source references
  bq_project: 'us-aviation-analytics'
  raw_dataset: 'raw'